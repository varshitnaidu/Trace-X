# Netlify Configuration for TRACE-X (Frontend Directory)
# Used when the site's Base Directory in Netlify is set directly to "frontend"

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Optional: Proxy API requests to your hosted FastAPI backend
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performance & Caching headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
