# Netlify Configuration for TRACE-X
# Repository root configuration (Monorepo: Frontend + Backend)

[build]
  # Navigate into frontend folder before building
  base = "frontend"
  
  # Directory where Vite outputs production files (relative to base)
  publish = "dist"
  
  # Build command
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Optional: Proxy API requests to your hosted FastAPI backend (e.g. Render, Railway, Fly.io, AWS)
# Uncomment and update the URL when your backend is deployed:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) routing fallback
# Redirects all other requests to index.html with HTTP 200 to prevent 404s on page refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performance & Caching headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
